<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clear service workers — MaCo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
      }
      code {
        background: #eee;
        padding: 0.1em 0.35em;
      }
    </style>
  </head>
  <body>
    <h1>Clear localhost service workers</h1>
    <p>
      A leftover Workbox / PWA from another project can blank out
      <code>localhost:5173</code> (looking for <code>main.jsx</code>).
    </p>
    <p id="status">Clearing…</p>
    <p><a href="/">← Back to MaCo</a></p>
    <script>
      (async function () {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
            status.textContent = "Unregistered " + regs.length + " service worker(s).";
          } else {
            status.textContent = "No service worker API in this browser.";
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
            status.textContent += " Cleared " + keys.length + " cache(s).";
          }
          status.textContent += " Reloading home in 1s…";
          setTimeout(function () {
            location.href = "/";
          }, 1000);
        } catch (e) {
          status.textContent = "Failed: " + e;
        }
      })();
    </script>
  </body>
</html>
